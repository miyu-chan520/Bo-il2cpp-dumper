name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Android package name to target:"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle

    - name: Run package-name validation tests
      run: python3 -m unittest discover -s tests -v

    - name: Configure target package
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
      run: python3 scripts/configure_target.py --package-name "$PACKAGE_NAME"

    - name: Build module
      run: |
        chmod +x ./gradlew
        ./gradlew :module:assembleRelease

    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/

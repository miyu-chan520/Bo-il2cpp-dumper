name: Build
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game (default: com.dts.freefireth):"
        required: false
        default: "com.dts.freefireth"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle

    - run: |
        chmod +x ./gradlew
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        if [ -z "$TARGET_PKG" ]; then
          TARGET_PKG="com.dts.freefireth"
        fi
        echo "Building Zygisk module for package: $TARGET_PKG"
        sed -i "s/moduleDescription = \"/moduleDescription = \"($TARGET_PKG) /g" module.gradle
        sed -i "s/com.game.packagename/$TARGET_PKG/g" module/src/main/cpp/game.h
        sed -i "s/com.dts.freefireth/$TARGET_PKG/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease

    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/*.zip

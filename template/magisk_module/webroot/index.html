<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zygisk-Il2CppDumper</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #121212; color: #fff; margin: 0; }
    h1 { font-size: 20px; color: #4CAF50; margin-bottom: 6px; }
    p { font-size: 13px; color: #aaa; margin-top: 0; }
    .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-top: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    label { font-size: 13px; font-weight: bold; color: #ddd; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 15px; margin: 8px 0; }
    button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:active { background: #388E3C; }
    .btn-secondary { background: #2196F3; }
    .btn-secondary:active { background: #1976D2; }
    .btn-warning { background: #FF9800; }
    .btn-warning:active { background: #F57C00; }
    .status { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; font-family: monospace; white-space: pre-wrap; background: #000; color: #00e676; max-height: 250px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Zygisk-Il2CppDumper</h1>
  <p>Runtime IL2CPP Dumper with Toast Notifications</p>

  <div class="card">
    <label>Target Game Package:</label>
    <input type="text" id="pkgInput" value="com.dts.freefireth" placeholder="e.g. com.dts.freefireth" />
    <button onclick="setPackage()">Save Target Package</button>
  </div>

  <div class="card">
    <button class="btn-secondary" onclick="checkDump()">Check & Copy dump.cs + script.json to Download</button>
    <button class="btn-warning" onclick="viewLog()">View Latest Execution Log</button>
    <div id="output" class="status">Ready</div>
  </div>

  <script>
    function log(msg) {
      document.getElementById('output').innerText = msg;
    }

    function exec(cmd) {
      return new Promise((resolve) => {
        if (typeof ksu !== 'undefined' && ksu.exec) {
          ksu.exec(cmd, '{}', (errno, stdout, stderr) => {
            resolve({ errno, stdout, stderr });
          });
        } else {
          resolve({ stdout: 'KSU WebUI API not found (running outside Manager)' });
        }
      });
    }

    async function init() {
      const res = await exec('getprop persist.il2cppdumper.package');
      if (res.stdout && res.stdout.trim()) {
        document.getElementById('pkgInput').value = res.stdout.trim();
        log('Current target: ' + res.stdout.trim());
      } else {
        log('Target: com.dts.freefireth (default)');
      }
    }

    async function setPackage() {
      const pkg = document.getElementById('pkgInput').value.trim();
      if (!pkg) return;
      await exec('setprop persist.il2cppdumper.package ' + pkg);
      log('Target package updated to: ' + pkg);
    }

    async function checkDump() {
      const pkg = document.getElementById('pkgInput').value.trim() || 'com.dts.freefireth';
      log('Checking dump for ' + pkg + '...');
      const checkCmd = 'sh -c "mkdir -p /sdcard/Download; if [ -f /data/data/' + pkg + '/files/dump.cs ]; then cp /data/data/' + pkg + '/files/dump.cs /sdcard/Download/' + pkg + '_dump.cs && chmod 666 /sdcard/Download/' + pkg + '_dump.cs && echo [SUCCESS] dump.cs copied to Download; else echo [-] dump.cs not generated yet; fi; if [ -f /data/data/' + pkg + '/files/script.json ]; then cp /data/data/' + pkg + '/files/script.json /sdcard/Download/' + pkg + '_script.json && chmod 666 /sdcard/Download/' + pkg + '_script.json && echo [SUCCESS] script.json copied to Download; fi"';
      const res = await exec(checkCmd);
      log(res.stdout || res.stderr);
    }

    async function viewLog() {
      const pkg = document.getElementById('pkgInput').value.trim() || 'com.dts.freefireth';
      log('Reading latest log...');
      const logCmd = 'sh -c "if [ -f /data/data/' + pkg + '/files/il2cppdumper.log ]; then cat /data/data/' + pkg + '/files/il2cppdumper.log; elif [ -f /data/local/tmp/il2cppdumper.log ]; then cat /data/local/tmp/il2cppdumper.log; else echo [-] No log file found yet. Launch the game first.; fi"';
      const res = await exec(logCmd);
      log(res.stdout || res.stderr);
    }

    init();
  </script>
</body>
</html>
